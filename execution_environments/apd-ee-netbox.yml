---
# NetBox Network Security EE (spec section 6) — dedicated runtime for the
# NetBox Security Inventory source and the new security/bootstrap jobs.
# Product Demos EE and the existing shared EE definitions stay untouched.
#
# The base image keeps the AAP 2.7 core 2.16 runtime used by the existing APD
# EEs so proven dependency ceilings carry over; a justified newer-core rebuild
# remains acceptable future work after live validation.
version: 3
images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-27/ee-minimal-rhel9:2.16
dependencies:
  galaxy: requirements-netbox.yml
  system:
    - python3.12-devel [platform:rpm]
  python:
    # NetBox inventory/seed/evidence dependencies (netbox.netbox 3.23.1 needs
    # pynetbox, packaging, pytz).
    - pynetbox>=6.6.0
    - packaging
    - pytz
    # Existing SSH transport dependencies for network_cli device access.
    - paramiko
    - ncclient>=0.7.0
    - passlib>=1.7.4
  python_interpreter:
    python_path: /usr/bin/python3.12

additional_build_files:
  - src: ansible.cfg
    dest: configs

options:
  package_manager_path: /usr/bin/microdnf

additional_build_steps:
  prepend_galaxy:
    - ADD _build/configs/ansible.cfg /etc/ansible/ansible.cfg
    - ARG ANSIBLE_GALAXY_SERVER_CERTIFIED_TOKEN
    - ARG ANSIBLE_GALAXY_SERVER_VALIDATED_TOKEN
  append_final:
    # remove development dependencies
    - RUN microdnf remove -y python3.12-devel
